# ─────────────────────────────────────────────────────────────────────────────
# Sidewire Rust Display client — release CI SKETCH (Phase 8 M4)
#
# ⚠️  STARTING POINT, NOT A WORKING PIPELINE. This has NEVER run on a real GitHub
#     runner. It is a documented scaffold to iterate on — expect to fix ffmpeg
#     package names, DLL/soname lists, and the packaging steps once a real run
#     surfaces them. It deliberately does NOT claim to produce shippable artifacts.
#
# To activate: move this file to `.github/workflows/release.yml` at the REPO ROOT
# (GitHub only runs workflows from there), keeping the `working-directory` and
# `paths` pointed at `clients/sidewire-viewer/`. The macOS keg-only ffmpeg env
# (FFMPEG_DIR / PKG_CONFIG_PATH / DYLD_FALLBACK_LIBRARY_PATH) is a dev-box quirk
# and is NOT needed on the Linux/Windows runners below (system ffmpeg is on the
# default pkg-config path there).
# ─────────────────────────────────────────────────────────────────────────────
name: release (sketch)

on:
  workflow_dispatch: {}       # manual only until validated
  # push:
  #   tags: ["v*"]            # enable once the jobs actually pass

permissions:
  contents: read

defaults:
  run:
    working-directory: clients/sidewire-viewer

jobs:
  # ── Linux: build + (later) AppImage / .deb ─────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # ffmpeg DEV libs. NOTE: `ubuntu-latest` today is the 24.04 LTS, whose apt ships
      # ffmpeg **6.x** (libavcodec 60), NOT 7.x. `ffmpeg-the-third` v3 targets 7.x but
      # also compiles against 6.x; whichever you use, VERIFY on the runner
      # (`dpkg -l 'libavcodec*'`, then `ldd target/release/sidewire-viewer`). To match the
      # dev build (ffmpeg 7.1 / libavcodec 61) exactly, install 7.x from a PPA or build it
      # from source and set FFMPEG_DIR before `cargo build`. This step (6.x apt) is a
      # starting point that has NOT been run on a real runner.
      - name: Install ffmpeg dev libs + Vulkan loader (verify version — see note)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev libavutil-dev libswresample-dev \
            pkg-config libvulkan1 mesa-vulkan-drivers

      - name: Build (release)
        run: cargo build --release

      - name: Show actual linked libs (bundle EXACTLY these, don't trust the docs)
        run: ldd target/release/sidewire-viewer || true

      # TODO: package. Baseline AppImage via linuxdeploy (bundles libavcodec/libavutil
      # + transitive deps; graphics drivers intentionally excluded so the host GPU
      # driver is used). See packaging/README.md § Linux.
      #   - assemble AppDir (usr/bin + usr/share/applications/*.desktop + icon)
      #   - linuxdeploy --appdir AppDir --output appimage
      # Alternative: cargo-deb with a verified [package.metadata.deb] depends list.
      - name: Package (AppImage) — TODO, untested
        run: |
          echo "TODO: assemble AppDir + run linuxdeploy --appimage (see packaging/README.md)"

      - uses: actions/upload-artifact@v4
        with:
          name: sidewire-viewer-linux
          path: clients/sidewire-viewer/target/release/sidewire-viewer
          if-no-files-found: error

  # ── Windows: build + (later) .zip / MSI ────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # ffmpeg 7.x SHARED build with dev headers/libs, exposed via FFMPEG_DIR so
      # the `ffmpeg-the-third` build script (bindgen + link) finds include/ + lib/.
      # vcpkg or a gyan.dev "shared" build both work — pin the version and VERIFY it
      # is 7.x. The matching runtime DLLs (avcodec-61.dll, avutil-59.dll, …) live in
      # that build's bin/ and must be bundled next to the exe.
      - name: Install ffmpeg 7.x (shared, dev)
        shell: pwsh
        run: |
          echo "TODO: install ffmpeg 7.x shared+dev (vcpkg install ffmpeg[avcodec,avutil]:x64-windows,"
          echo "      or download a gyan.dev shared build), then set FFMPEG_DIR to its root."
          # Example (vcpkg):
          #   vcpkg install ffmpeg[avcodec,avutil,swresample]:x64-windows
          #   echo "FFMPEG_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" >> $env:GITHUB_ENV

      - name: Build (release)
        run: cargo build --release

      # TODO: package. Copy the exe + the ffmpeg DLLs that `dumpbin /dependents`
      # reports (do NOT hardcode the list — read it off the binary), then zip.
      # Optional MSI via WiX v4 / cargo-wix (see packaging/README.md § Windows).
      - name: Package (.zip) — TODO, untested
        shell: pwsh
        run: |
          echo "TODO: dumpbin /dependents -> copy non-system DLLs next to exe -> Compress-Archive"

      - uses: actions/upload-artifact@v4
        with:
          name: sidewire-viewer-windows
          path: clients/sidewire-viewer/target/release/sidewire-viewer.exe
          if-no-files-found: error
