# Sidewire Rust Display client — Phase 8 (Windows/Linux viewer).
#
# The Rust client is always the DISPLAY role: TLS 1.3 listener, CPace responder.
# The Mac is always the Source (dialer / CPace initiator). See docs/00-decisions.md §D10
# and docs/08-status-and-gaps.md. The wire protocol + pairing crypto are the fixed conformance target
# in ../../protocol-vectors/ and docs/02 + docs/05 (do NOT modify those).
[workspace]
resolver = "2"
members = ["sidewire-proto", "sidewire-crypto", "sidewire-media", "sidewire-viewer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"
publish = false

# One crypto backend across the tree: rustls + rcgen both on `ring` (no cmake/aws-lc needed).
[workspace.dependencies]
# in-workspace
sidewire-proto = { path = "sidewire-proto" }
sidewire-crypto = { path = "sidewire-crypto" }
sidewire-media = { path = "sidewire-media" }

# protocol / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# media decode (ffmpeg 7.x — libavcodec 61). Only sidewire-media links ffmpeg; the rest of the
# workspace stays ring-only. See README.md for the macOS keg-only ffmpeg@7 build/run env.
#
# default-features = false is deliberate and load-bearing for packaging. The crate's defaults pull
# in `device`, `filter`, `software-resampling` and `software-scaling`, which made the binary link
# SEVEN ffmpeg libraries instead of three — worst of all libavdevice, which drags in the platform
# capture backends (v4l2/ALSA/X11-grab, dshow/gdigrab) into a program that never opens a capture
# device. We only ever decode. `format` cannot be dropped alongside `codec`: ffmpeg-the-third 3.0.2's
# packet module references av_interleaved_write_frame ungated, so `codec` alone fails to compile.
ffmpeg-the-third = { version = "3", default-features = false, features = [
    "codec",
    "format",
    "non-exhaustive-enums",
] }

# window / GPU render
winit = "0.30"
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

# crypto
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = "1"
x509-parser = "0.16"

# discovery (mDNS/DNS-SD). Advertises `_sidewire._tcp` (the Display's job) and can browse for a
# `--discover` diagnostic. Pure `ServiceInfo` construction/parse works without a running daemon,
# so the TXT parse logic is unit-testable off the network (multicast doesn't resolve in CI).
mdns-sd = "0.13"

# util
hex = "0.4"
log = "0.4"
