name: Sidewire
options:
  bundleIdPrefix: com.kinocoder
  deploymentTarget:
    macOS: "14.0"
  minimumXcodeGenVersion: "2.30"
  # F1 — English is the source/development language; the String Catalog
  # (Sidewire/Resources/Localizable.xcstrings) ships en-only at v1. Further locales are a
  # translation task, not an engineering one (doc 09 D13).
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Keep this full semver (x.y.z) and in lockstep with the package.json files — release.sh reads
    # it verbatim to name the DMG, so "1.0" produced Sidewire-1.0.dmg while everything else said
    # 1.0.0. scripts/release.mjs rewrites this line on every version bump.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Universal 2 (arm64 + x86_64) so one build runs on the M4 Max source and Intel i9 display.
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: "NO"
    # Ad-hoc signing by default, so a fresh clone builds for anyone — no Apple account, no
    # provisioning profile, no certificate. Distribution signing is a separate concern handled
    # by scripts/release.sh (Developer ID Application + hardened runtime + notarization).
    #
    # Trade-off: an ad-hoc signature changes on every build, so macOS resets the app's Screen
    # Recording / Accessibility (TCC) grants each time you rebuild. If you are iterating locally
    # and that gets tiresome, sign with a stable identity of your own — pass it on the command
    # line rather than editing this file, so the checked-in default stays buildable for everyone:
    #
    #   security find-identity -v -p codesigning        # find your identity's SHA-1
    #   xcodebuild … CODE_SIGN_IDENTITY=<sha1> CODE_SIGNING_REQUIRED=YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    # G1 — hardened runtime in dev builds too, so hardened-only failures (notably the
    # --vd-helper self-re-exec) surface here rather than first in a shipped build. release.sh
    # sets this explicitly as well (harmless duplication). Dev signing (Apple Development cert)
    # + hardened runtime runs locally without notarization.
    ENABLE_HARDENED_RUNTIME: "YES"
    # F1 — String Catalog. Have the compiler emit localizable strings so Xcode's automatic
    # extraction merges them into Sidewire/Resources/Localizable.xcstrings at build time
    # (Text("…") literals and the String(localized:) status strings). English-only at v1.
    SWIFT_EMIT_LOC_STRINGS: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"

packages:
  SidewireProtocol:
    path: Packages/SidewireProtocol
  SidewireCore:
    path: Packages/SidewireCore
  # Phase 9 — Sparkle 2 auto-update (EdDSA appcast on GitHub Releases). Its universal
  # (arm64+x86_64) xcframework matches ARCHS. Xcode embeds + signs Sparkle's XPC services in the
  # correct inside-out order automatically — NEVER `codesign --deep` (it corrupts those XPC
  # signatures). Sparkle is the app's first and only network "phone-home"; everything else is
  # 100% local (no accounts, no telemetry).
  #
  # PINNED EXACTLY, on purpose. `.xcodeproj` is generated and gitignored, so the app target's
  # Package.resolved is never committed — this line IS the lock file. With a `from:` range, two
  # clones a week apart could ship different Sparkle builds inside a signed, notarized artifact,
  # and the one component that reaches the network is the last one where that should be left to
  # chance. Bump this deliberately, and re-read Sparkle's release notes when you do.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.5

targets:
  Sidewire:
    type: application
    platform: macOS
    sources:
      - path: Sidewire
    dependencies:
      - package: SidewireProtocol
      - package: SidewireCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinocoder.sidewire
        PRODUCT_NAME: Sidewire
        INFOPLIST_FILE: Sidewire/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sidewire/Resources/Sidewire.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Sidewire/Private/Sidewire-Bridging-Header.h
