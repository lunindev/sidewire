name: Release (macOS)

# Builds, signs, notarizes and publishes the macOS app for a vX.Y.Z tag.
#
# ⚠️  NEVER RUN. Written from a green local build, but no runner has executed it and no release has
#     ever been cut. Expect to iterate on the first attempt — use workflow_dispatch against a test
#     tag before trusting it with a real one.
#
# Prerequisites, all of them one-time owner steps (see TODO.md § owner-gated):
#   • Info.plist SUFeedURL must name the real GitHub owner, and SUPublicEDKey must be a real key.
#     release.sh refuses to run otherwise, which is the correct behaviour — a release nobody can
#     update is worse than no release.
#   • Tags must be ANNOTATED. scripts/release.mjs creates them correctly; a lightweight tag is not
#     pushed by `git push --follow-tags` and this workflow would simply never fire.
#
# Required repository secrets:
#   MACOS_CERT_P12_BASE64    base64 of the exported "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD      the .p12 export password
#   MACOS_KEYCHAIN_PASSWORD  any random string; scopes the temporary keychain only
#   MACOS_SIGN_IDENTITY      e.g. "Developer ID Application: NAME (TEAMID)"
#   MACOS_TEAM_ID            the 10-character Apple Developer Team ID
#   NOTARY_ISSUER_ID         App Store Connect issuer UUID
#   NOTARY_KEY_ID            10-character key id
#   NOTARY_KEY_P8_BASE64     base64 of AuthKey_<KEY_ID>.p8
#   SPARKLE_ED_PRIVATE_KEY   output of `generate_keys -x <file>`, verbatim, single line
#
# An App Store Connect API key is used rather than an app-specific password: it is revocable on its
# own, survives Apple ID password and 2FA changes, and keeps a personal Apple ID out of CI config.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write   # needed to create the GitHub Release and upload assets

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      # All four `security` calls are required. Omitting set-key-partition-list is the classic
      # failure: codesign then tries to raise a GUI authorisation prompt, which cannot exist on a
      # runner, and fails with the uninformative errSecInternalComponent.
      - name: Import the Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Lock after 6 h and on sleep, so the key cannot outlive the job on a reused runner.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Put it on the search list, keeping the existing keychains so system roots still resolve.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          rm -f "$CERT"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

          echo "Signing identities now visible:"
          security find-identity -v -p codesigning

      - name: Stage the notarization key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          echo "NOTARY_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      # SIDEWIRE_STRICT=1 is the important flag. Without it, a missing credential makes release.sh
      # build an unnotarized DMG and exit 0 — a green job publishing a build Gatekeeper will block.
      - name: Build, sign, notarize, staple, and sign the appcast
        working-directory: app
        env:
          SIDEWIRE_STRICT: '1'
          SIDEWIRE_APPCAST: '1'
          SIDEWIRE_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          SIDEWIRE_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: ./scripts/release.sh

      # Belt and braces: release.sh already runs these, but a published artifact that is not
      # actually stapled is the single most expensive mistake here — it only shows up on a user's
      # machine, offline, after download.
      - name: Verify the DMG is notarized and stapled
        working-directory: app
        run: |
          set -euo pipefail
          DMG=$(ls dist/*.dmg)
          echo "verifying $DMG"
          xcrun stapler validate "$DMG"
          spctl -a -vvv -t install "$DMG"

      - name: Checksums
        working-directory: app/dist
        run: shasum -a 256 *.dmg appcast.xml | tee SHA256SUMS

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        working-directory: app/dist
        run: |
          set -euo pipefail
          # --verify-tag so a typo in a manual dispatch cannot invent a release off a missing tag.
          gh release create "$TAG" \
            --verify-tag \
            --title "Sidewire $TAG" \
            --notes "See CHANGELOG.md for what changed in this release." \
            *.dmg appcast.xml SHA256SUMS

      # Runs even when an earlier step failed, so a signing key is never left behind on the runner.
      - name: Remove the temporary keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$NOTARY_KEY_PATH" 2>/dev/null || true
