name: Release (landing)

# Builds the landing site into a container image and publishes it to GitHub Container Registry on
# every vX.Y.Z tag. This replaces the old .gitlab-ci.yml, which could never have worked here: it
# was gated on tags the release tooling failed to push, and pinned to a self-hosted runner
# (`tags: - local`) that does not exist on any shared infrastructure.
#
# Why a container rather than GitHub Pages: the site ships a strict Content-Security-Policy and a
# Permissions-Policy from nginx.conf, and Pages cannot set response headers. Those headers are the
# point — the site makes zero external requests, so a near-maximally strict CSP applies with no
# breakage, and throwing that away to save a deployment step would be a poor trade.
#
# Deploying the published image is out of scope here: pull
# ghcr.io/<owner>/sidewire-landing:<tag> wherever it is hosted.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sidewire-landing

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the site before the image, so a type error or a broken build fails here — with a
      # readable log — rather than somewhere inside a Docker layer.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Build and type-check
        working-directory: landing
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: landing
          file: landing/Dockerfile
          target: landing-prod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The security headers are the reason this is a container at all, so assert they survived
      # rather than trusting that nginx.conf was copied correctly.
      - name: Verify the security headers on the built image
        run: |
          set -euo pipefail
          docker run -d --rm --name landing-check -p 18080:8080 "${IMAGE}:${{ github.ref_name }}"
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:18080/ && break
            sleep 1
          done
          HEADERS=$(curl -sSI http://127.0.0.1:18080/)
          echo "$HEADERS"
          docker stop landing-check
          for h in Content-Security-Policy X-Content-Type-Options X-Frame-Options Referrer-Policy Permissions-Policy; do
            echo "$HEADERS" | grep -qi "^$h:" || { echo "✗ missing $h"; exit 1; }
          done
          echo "$HEADERS" | grep -qi '^Server: nginx/[0-9]' && { echo "✗ server_tokens is on — the exact version is exposed"; exit 1; }
          echo "✓ all security headers present, version not disclosed"
