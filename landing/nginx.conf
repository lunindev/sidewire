# Static-site server for the Sidewire landing (Astro `dist/`).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml;

    # Sensible security headers for a static marketing site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets are immutable — cache them hard.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx does NOT inherit outer add_header directives once a block defines its own, so the
        # server-level security headers must be repeated here or hashed assets ship without them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # Everything else: serve the file, its directory index, or the .html twin
    # (Astro emits clean-URL pages as <name>/index.html).
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
