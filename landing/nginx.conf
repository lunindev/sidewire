# Static-site server for the Sidewire landing (Astro `dist/`).
#
# Port 8080, not 80: the image is `nginxinc/nginx-unprivileged`, whose master process runs as a
# non-root user and therefore cannot bind a privileged port. See Dockerfile.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in Server: or on generated error pages.
    server_tokens off;

    # gzip text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml;

    # Sensible security headers for a static marketing site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # This site makes ZERO external requests: no web fonts, no CDN, no third-party scripts, no
    # embeds, no XHR — every icon is inline SVG and the only images are same-origin. So the policy
    # starts from `default-src 'none'` and adds back only what the pages actually load:
    #   style-src  'self' 'unsafe-inline'  Astro inlines small component stylesheets as <style>
    #                                      blocks (inlineStylesheets: 'auto' is the default), and
    #                                      the WireDiagram SVG is styled the same way. Hashes would
    #                                      have to be regenerated on every copy edit.
    #   img-src    'self' data:            favicon.svg + og.png, same origin; data: is there so an
    #                                      inline data-URI image never breaks the page.
    #   script-src 'none'                  the site ships no JavaScript at all. The JSON-LD blocks
    #                                      (<script type="application/ld+json">) are NOT affected:
    #                                      HTML's "prepare the script element" algorithm returns
    #                                      early for a non-JavaScript MIME type, before the CSP
    #                                      check runs, so the browser never treats them as script.
    #                                      If a real script is ever added, this must change.
    #   frame-ancestors 'self'             kept in step with X-Frame-Options SAMEORIGIN above.
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; manifest-src 'self'" always;

    # Nothing on this site uses any of these, so switch the whole surface off.
    add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;

    # Hashed build assets are immutable — cache them hard.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx does NOT inherit outer add_header directives once a block defines its own, so the
        # server-level security headers must be repeated here or hashed assets ship without them.
        # That includes the two below — keep all five in sync with the server block above.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; manifest-src 'self'" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
        access_log off;
        try_files $uri =404;
    }

    # Everything else: serve the file, its directory index, or the .html twin
    # (Astro emits clean-URL pages as <name>/index.html).
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
