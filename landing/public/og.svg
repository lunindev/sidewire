<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="0%" r="70%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#08090d"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- brand -->
  <g transform="translate(88 84)">
    <rect width="34" height="34" rx="9" fill="url(#g)"/>
    <text x="48" y="26" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="27" font-weight="700" fill="#eceef4">Sidewire</text>
  </g>

  <!-- headline -->
  <text x="88" y="300" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="72" font-weight="700" fill="#eceef4" letter-spacing="-2">Give your main Mac</text>
  <text x="88" y="384" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="72" font-weight="700" letter-spacing="-2" fill="url(#g)">a second screen.</text>

  <text x="90" y="452" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="30" fill="#a6adbb">Using a Mac you already own. Over Thunderbolt or Wi‑Fi. Not screen sharing.</text>

  <!-- mini wire motif -->
  <g transform="translate(88 520)">
    <circle cx="10" cy="10" r="8" fill="none" stroke="url(#g)" stroke-width="2"/>
    <line x1="18" y1="10" x2="120" y2="10" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <path d="M70 2l-7 10h5l-2 8 8-11h-5l3-7z" fill="#34d399"/>
    <circle cx="128" cy="10" r="8" fill="none" stroke="url(#g)" stroke-width="2"/>
    <text x="152" y="16" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#6d7688">macOS 14+ · 100% local · MIT</text>
  </g>
</svg>
