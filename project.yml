name: MacDisplay
options:
  bundleIdPrefix: com.macdisplay
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.30"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  SenderApp:
    type: application
    platform: macOS
    sources:
      - path: SenderApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macdisplay.sender
        INFOPLIST_FILE: SenderApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: SenderApp/SenderApp.entitlements
        PRODUCT_NAME: SenderApp
        SWIFT_OBJC_BRIDGING_HEADER: SenderApp/SenderApp-Bridging-Header.h
        CODE_SIGNING_ALLOWED: "NO"

  ReceiverApp:
    type: application
    platform: macOS
    sources:
      - path: ReceiverApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macdisplay.receiver
        INFOPLIST_FILE: ReceiverApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: ReceiverApp/ReceiverApp.entitlements
        PRODUCT_NAME: ReceiverApp
        CODE_SIGNING_ALLOWED: "NO"
