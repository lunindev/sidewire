name: Sidewire
options:
  bundleIdPrefix: com.kinocoder
  deploymentTarget:
    macOS: "14.0"
  minimumXcodeGenVersion: "2.30"
  # F1 — English is the source/development language; the String Catalog
  # (Sidewire/Resources/Localizable.xcstrings) ships en-only at v1. Further locales are a
  # translation task, not an engineering one (doc 09 D13).
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Universal 2 (arm64 + x86_64) so one build runs on the M4 Max source and Intel i9 display.
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: "NO"
    # Sign with a stable Apple Development identity (by cert hash, so no Xcode account /
    # provisioning profile is required) — this keeps Screen Recording / Accessibility TCC
    # grants alive across rebuilds. Developer ID + notarization for distribution is Phase 5.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "3A28D3256EEB6B7E4378E0540CB26C02CF883941"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    # G1 — hardened runtime in dev builds too, so hardened-only failures (notably the
    # --vd-helper self-re-exec) surface here rather than first in a shipped build. release.sh
    # sets this explicitly as well (harmless duplication). Dev signing (Apple Development cert)
    # + hardened runtime runs locally without notarization.
    ENABLE_HARDENED_RUNTIME: "YES"
    # F1 — String Catalog. Have the compiler emit localizable strings so Xcode's automatic
    # extraction merges them into Sidewire/Resources/Localizable.xcstrings at build time
    # (Text("…") literals and the String(localized:) status strings). English-only at v1.
    SWIFT_EMIT_LOC_STRINGS: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"

packages:
  SidewireProtocol:
    path: Packages/SidewireProtocol
  SidewireCore:
    path: Packages/SidewireCore
  # Phase 9 — Sparkle 2 auto-update (EdDSA appcast on GitHub Releases). Resolves as 2.9.4
  # today; its universal (arm64+x86_64) xcframework matches ARCHS. Xcode embeds + signs
  # Sparkle's XPC services in the correct inside-out order automatically — NEVER `codesign
  # --deep` (it corrupts those XPC signatures). Sparkle is the app's first and only
  # network "phone-home"; everything else is 100% local (no accounts, no telemetry).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.0.0

targets:
  Sidewire:
    type: application
    platform: macOS
    sources:
      - path: Sidewire
    dependencies:
      - package: SidewireProtocol
      - package: SidewireCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinocoder.sidewire
        PRODUCT_NAME: Sidewire
        INFOPLIST_FILE: Sidewire/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sidewire/Resources/Sidewire.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Sidewire/Private/Sidewire-Bridging-Header.h
